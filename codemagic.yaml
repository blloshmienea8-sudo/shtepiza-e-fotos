workflows:
  ios-release:
    name: Shtepiza e Fotos - iOS
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shtepizaefotos.app
      xcode: latest
    scripts:
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ShtepizaEFotos.xcodeproj" \
            --scheme "ShtepizaEFotos"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
