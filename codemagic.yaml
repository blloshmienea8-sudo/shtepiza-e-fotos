workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - echo "Starting iOS build..."
      - pod install || true
      - xcodebuild -workspace Shtepizaefotos.xcworkspace -scheme Shtepizaefotos -configuration Release -sdk iphoneos
